; Briefly AI — overrides PHP pour le DEV uniquement (monté via compose.override.yaml).
; Réactive la revalidation OPcache : les changements de code/config sont pris en compte
; sans redémarrer le conteneur (contrairement au réglage prod validate_timestamps=0 de 10-app.ini).
; Chargé après 10-app.ini (préfixe 30-) donc écrase la valeur prod en dev.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
