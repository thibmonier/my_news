; Briefly AI — PHP configuration
; Optimisé pour FrankenPHP worker mode

; OPcache (critique en worker mode — FrankenPHP garde les processus en vie)
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=20
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
; opcache.preload est activé uniquement au runtime prod (docker/php/preload.ini),
; sinon les stages de build (composer install) échouent : config/preload.php absent.

; Sécurité (constitution §6, OWASP #5)
expose_php=Off
display_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT

; Limites
memory_limit=256M
max_execution_time=30
upload_max_filesize=10M
post_max_size=12M

; Internationalisation
default_charset=UTF-8
date.timezone=UTC

; Session — sécurité cookies (framework.yaml complète)
session.cookie_httponly=1
session.use_strict_mode=1
