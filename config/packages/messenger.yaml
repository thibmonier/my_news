## Briefly AI — Symfony Messenger (Redis Streams)
## ADR-006 : Redis Streams, consumer groups, DLQ
## tech-spec §11.5 : retry strategy backoff exponentiel

framework:
    messenger:
        # DLQ pour les messages échoués (tech-spec §11.5)
        failure_transport: failed

        transports:
            # Transport async principal — Redis Streams (MESSENGER_TRANSPORT_DSN)
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: messenger.async
                    group: symfony
                    consumer: '%env(default:hostname:HOSTNAME)%'
                retry_strategy:
                    max_retries: 3
                    delay: 300000      # 5 min (US-003 spec : backoff 5 min, 10 min, 20 min)
                    multiplier: 2      # backoff exponentiel : 5min → 10min → 20min
                    max_delay: 1200000 # 20 min max (tech-spec §11.5)

            # Dead Letter Queue
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: messenger.failed
                    group: symfony_failed

        # Routing : mappé par namespace de message (à compléter au fil des sprints)
        routing:
            # US-020 : ingestion RSS — un message par source active, traitement parallèle
            App\Application\Feed\FetchSource\FetchSourceMessage: async
            # US-002 : génération du Daily Brief — un message par date
            App\Application\Brief\GenerateDailyBrief\GenerateDailyBriefMessage: async
            # US-021 : validation asynchrone d'une source (HEAD HTTP → status active|validation_failed)
            App\Application\Feed\ValidateSource\ValidateSourceMessage: async
            # US-021 : mise à jour groupée (dispatch un FetchSourceMessage par source active)
            App\Application\Feed\BulkFetch\BulkFetchMessage: async
