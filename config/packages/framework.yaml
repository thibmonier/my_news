## Briefly AI — Symfony Framework configuration
## Sécurité sessions : HttpOnly + Secure + SameSite=strict (constitution §6)

framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: strict
        cookie_httponly: true
        gc_maxlifetime: 1800    # 30 min — constitution §6, ADR-006
        cookie_lifetime: 0

    php_errors:
        log: true

    # Exceptions : log_level contrôlé (pas de stack trace en prod — OWASP #7)
    exceptions:
        Symfony\Component\HttpKernel\Exception\NotFoundHttpException:
            log_level: info
            status_code: 404
        Symfony\Component\HttpKernel\Exception\AccessDeniedHttpException:
            log_level: info
            status_code: 403

    # Validator
    validation:
        email_validation_mode: html5

    # Assets (si actif)
    assets: ~
