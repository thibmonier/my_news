## Briefly AI — Sécurité Symfony
## Constitution §6 : Argon2id (sodium), deny by default, voters, UUID non séquentiels
## ADR-005 : OAuth2 (Google/GitHub) + JWT mobile + session desktop
## ADR-007 §7 : voters explicites sur chaque opération API Platform

security:
    # Hachage mots de passe : sodium = Argon2id via libsodium (constitution §6)
    # Jamais MD5/SHA1/bcrypt en nouveau code.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: sodium

    # Providers
    providers:
        # Sprint 1 : admin en mémoire pour l'UI /admin (Walking Skeleton — ADR-005).
        # Sprint 2 : remplacé par OAuth2 (Google/GitHub) + JWT mobile.
        # Production : aucun utilisateur défini — le provider existe pour le firewall admin.
        # Les utilisateurs réels sont définis dans when@test: uniquement (tests) ou OAuth2 (prod Sprint 2).
        users_in_memory:
            memory:
                users: []

        # US-030 : Utilisateurs inscrits par email — provider Doctrine.
        app_users:
            entity:
                class: App\Infrastructure\User\Persistence\DoctrineUserEntity
                property: email

    firewalls:
        # Exclure profiler/debugger en dev
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Firewall admin — HTTP Basic + sessions pour /admin (CSRF requiert sessions — Sprint 2)
        # stateless retiré en Sprint 2 : les formulaires CRUD nécessitent la session (CSRF tokens)
        admin:
            pattern: ^/admin
            provider: users_in_memory
            http_basic:
                realm: 'Briefly AI Admin'

        # Firewall principal — form_login pour le desktop (ADR-001, ADR-005)
        # Session HttpOnly + SameSite=Strict (framework.yaml)
        # entry_point personnalisé : JSON 401 pour /api/* (OWASP A05), redirect /login pour le web.
        # US-031 : custom_authenticators OAuth2 (Google + GitHub) en plus de form_login.
        main:
            lazy: true
            provider: app_users
            entry_point: App\Presentation\Security\ApiAuthenticationEntryPoint
            form_login:
                login_path: /login
                check_path: /login
                default_target_path: /dashboard
                username_parameter: email
                password_parameter: password
                enable_csrf: true
            # US-031 : Authenticators OAuth2 — state CSRF géré par KnpU OAuth2Client
            custom_authenticators:
                - App\Infrastructure\User\Security\GoogleAuthenticator
                - App\Infrastructure\User\Security\GithubAuthenticator
            logout:
                path: /logout
                target: /

    # Deny by default (constitution §6) — accès explicites uniquement
    access_control:
        # US-001 : routes publiques (IS_AUTHENTICATED_ANONYMOUSLY)
        - { path: ^/brief, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        # US-031 : routes OAuth publiques (initiation + callback)
        - { path: ^/oauth/, roles: PUBLIC_ACCESS }
        # Routes authentifiées
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/api/v1/quota, roles: ROLE_USER }          # US-033 : quota endpoint authentifié
        - { path: ^/api/v1/synthesis, roles: ROLE_USER }    # US-010 : synthèse IA — authentification requise
        - { path: ^/api/v1/articles, roles: ROLE_USER }     # US-010/US-033 : synthesize par article ID
        - { path: ^/quota/paywall-modal, roles: ROLE_USER }  # US-033 : paywall modal authentifié
        - { path: ^/api/v1, roles: PUBLIC_ACCESS }           # API Platform — voters sur chaque opération

when@dev:
    security:
        # Admin de développement pour accéder au back-office /admin en local.
        # Identifiants : admin / admin (le password ci-dessous est le hash argon2id de "admin").
        # On stocke le hash (pas de plaintext) pour que le hasher sodium par défaut le vérifie —
        # évite le piège d'ordre de résolution des hashers (InMemoryUser instanceof
        # PasswordAuthenticatedUserInterface). N'existe qu'en APP_ENV=dev — aucun impact prod/test.
        providers:
            users_in_memory:
                memory:
                    users:
                        admin:
                            password: '$argon2id$v=19$m=65536,t=4,p=1$D2cVTbnc18yNgX2Z07W63w$Tf1yfO5XgcnA4mY85Lh07K9J764xt79teNYmvxoS5tA'
                            roles: ['ROLE_ADMIN']

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: plaintext
            App\Infrastructure\User\Persistence\DoctrineUserEntity:
                algorithm: plaintext
        # Passwords MUST be non-null: InMemoryFactory uses container.build_id for null passwords,
        # causing mismatch between loginUser(InMemoryUser(..., 'x', ...)) stored token and
        # refreshUser() return → isEqualTo fails → 401. Use literal 'test' here and in tests.
        providers:
            users_in_memory:
                memory:
                    users:
                        admin:
                            password: 'test'
                            roles: ['ROLE_ADMIN']
                        user:
                            password: 'test'
                            roles: ['ROLE_USER']
